name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agentrescue/requirements.lock
            agentrescue/requirements-paid.txt
      - name: Install pinned and paid-trial dependencies
        run: python -m pip install -r agentrescue/requirements.txt -r agentrescue/requirements.lock -r agentrescue/requirements-paid.txt
      - name: Compile and test
        run: |
          python -m compileall -q agentrescue
          python -m unittest discover -s agentrescue -v
